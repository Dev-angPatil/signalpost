<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Signalpost Companies</title>
<meta name="description" content="Norwegian company profiles: accounts, leadership, hiring and dated activity, each linked to its source.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400..800&display=swap">
<style>
/* Signalpost company browser.
   One accent, stamp blue, marks proof only (Verify, sources, the evidence slip, focus).
   Five signal lamps show what was found for a company: company record, annual
   accounts, people & places, website, public footprint. */
:root {
  --fog: #EEF2F1; --sheet: #FFFFFF; --sheet-2: #F6F8F7;
  --ink: #17211F; --slate: #55645F; --mute: #66736F;
  --rule: #D5DDDA; --rule-2: #E6EBE9;
  --stamp: #2E3A8C; --stamp-soft: #ECEEF8; --stamp-ink: #FFFFFF;
  --lamp-on: #1F7A52; --lamp-on-soft: #E5F2EB;
  --lamp-amber: #95600E; --lamp-amber-soft: #FBF1DF;
  --lamp-red: #B23B3B; --lamp-red-soft: #F8E7E6;
  --lamp-off: #C6CFCB;
  --overlay: rgba(23, 33, 31, .42);
  --lift: 0 18px 40px -18px rgba(23, 33, 31, .35);
  --sans: "Schibsted Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
  /* names kept for the script's inline styles */
  --text: var(--ink); --text-2: var(--slate); --text-3: var(--mute); --border: var(--rule); --border-strong: #B9C5C1;
  --surface: var(--sheet); --surface-2: var(--sheet-2); --primary: var(--stamp); --primary-soft: var(--stamp-soft);
  --good: var(--lamp-on); --good-bg: var(--lamp-on-soft); --bad: var(--lamp-red); --bad-bg: var(--lamp-red-soft);
  --warn: var(--lamp-amber); --warn-bg: var(--lamp-amber-soft); --muted-bg: var(--sheet-2); --navy: var(--ink);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fog: #0E1513; --sheet: #151E1B; --sheet-2: #1A2522;
    --ink: #E4EBE8; --slate: #9AA9A4; --mute: #7F8E89;
    --rule: #28342F; --rule-2: #212C28; --border-strong: #3A4842;
    --stamp: #9CA6F2; --stamp-soft: #1F2546; --stamp-ink: #10142C;
    --lamp-on: #4CC38A; --lamp-on-soft: #12291F;
    --lamp-amber: #E2A84A; --lamp-amber-soft: #2E2312;
    --lamp-red: #EE7B73; --lamp-red-soft: #331816;
    --lamp-off: #34423D;
    --overlay: rgba(0, 0, 0, .6); --lift: 0 18px 40px -18px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fog: #0E1513; --sheet: #151E1B; --sheet-2: #1A2522;
  --ink: #E4EBE8; --slate: #9AA9A4; --mute: #7F8E89;
  --rule: #28342F; --rule-2: #212C28; --border-strong: #3A4842;
  --stamp: #9CA6F2; --stamp-soft: #1F2546; --stamp-ink: #10142C;
  --lamp-on: #4CC38A; --lamp-on-soft: #12291F;
  --lamp-amber: #E2A84A; --lamp-amber-soft: #2E2312;
  --lamp-red: #EE7B73; --lamp-red-soft: #331816;
  --lamp-off: #34423D;
  --overlay: rgba(0, 0, 0, .6); --lift: 0 18px 40px -18px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--fog); color: var(--ink); font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
a { color: var(--stamp); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; text-decoration-color: color-mix(in srgb, var(--stamp) 35%, transparent); }
a:hover { text-decoration-color: currentColor; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: normal; }
code { font-family: var(--mono); font-size: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- signal lamps ---------- */
.lamps { display: inline-flex; gap: 3px; align-items: center; vertical-align: middle; }
.lamps i { width: 8px; height: 8px; border-radius: 50%; background: var(--lamp-off); display: block; }
.lamps i.on { background: var(--lamp-on); box-shadow: 0 0 0 2px var(--lamp-on-soft); }
.lamps i.half { background: var(--lamp-amber); box-shadow: 0 0 0 2px var(--lamp-amber-soft); }
.lamps i.err { background: var(--lamp-red); box-shadow: 0 0 0 2px var(--lamp-red-soft); }
.lamps.big { gap: 6px; }
.lamps.big i { width: 12px; height: 12px; }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px; padding: 12px 24px; background: var(--fog); border-bottom: 1px solid var(--rule); }
.brand { font-weight: 700; font-size: 18px; letter-spacing: -.02em; white-space: nowrap; display: flex; align-items: center; gap: 10px; color: var(--ink); }
.brand i { display: none; }
.brand .lamps i { display: block; width: 7px; height: 7px; }
.brand .lamps i:nth-child(odd) { background: var(--lamp-on); }
.search { flex: 1; max-width: 560px; position: relative; }
.search input { width: 100%; padding: 9px 14px 9px 38px; border-radius: 10px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); }
.search input::placeholder { color: var(--mute); }
.search input:focus { border-color: var(--stamp); outline: none; box-shadow: 0 0 0 3px var(--stamp-soft); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--mute); }
.top .spacer { flex: 1; }
.top-btn { background: transparent; color: var(--ink); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 14px; white-space: nowrap; font-weight: 500; }
.top-btn:hover { border-color: var(--border-strong); background: var(--sheet); }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 400px 1fr; height: calc(100vh - 63px); }
.side { border-right: 1px solid var(--rule); background: var(--sheet); display: flex; flex-direction: column; min-height: 0; }
.detail { overflow-y: auto; min-width: 0; }

/* ---------- run panel ---------- */
.runbar { border-bottom: 1px solid var(--rule); padding: 12px 18px; font-size: 13px; color: var(--slate); background: var(--sheet-2); }
.runbar summary { cursor: pointer; list-style: none; display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; color: var(--slate); }
.runbar summary::before { content: none; }
.runbar summary::-webkit-details-marker { display: none; }
.runbar summary::after { content: "Details"; margin-left: auto; color: var(--stamp); text-decoration: underline; text-underline-offset: 2px; text-decoration-color: color-mix(in srgb, var(--stamp) 35%, transparent); }
.runbar[open] summary::after { content: "Hide"; }
.runbar .ok { color: var(--lamp-on); font-weight: 600; }
.runbar .notok { color: var(--lamp-red); font-weight: 600; }
.runbar .run-body { margin-top: 12px; display: grid; gap: 14px; }
.runbar .run-body strong { color: var(--ink); font-weight: 600; }
.runbar ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
.covbar { display: grid; grid-template-columns: 128px 1fr 72px; gap: 10px; align-items: center; }
.covbar .bar { height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.covbar .bar i { display: block; height: 100%; background: var(--lamp-on); }
.covbar .num { text-align: right; color: var(--ink); }
.runbar .kvline { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--mute); font-size: 12px; }

/* ---------- filters ---------- */
.filters { padding: 14px 18px; border-bottom: 1px solid var(--rule); display: grid; gap: 10px; }
.filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.filters select { width: 100%; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); min-width: 0; color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-toggle { border: 1px solid var(--rule); background: var(--sheet); border-radius: 7px; padding: 4px 10px; font-size: 13px; color: var(--slate); }
.chip-toggle:hover { border-color: var(--border-strong); color: var(--ink); }
.chip-toggle[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.list-meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--mute); gap: 8px; }
#reset { background: none; border: 0; color: var(--stamp); padding: 0 0 0 8px; font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }
.sort-ctl { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.sort-ctl label { color: var(--mute); white-space: nowrap; }
.sort-ctl select { width: auto; padding: 4px 8px; border: 1px solid var(--rule); border-radius: 7px; background: var(--sheet); font-size: 13px; color: var(--ink); }
.sort-dir { width: 30px; height: 28px; display: inline-grid; place-items: center; border: 1px solid var(--rule); border-radius: 7px; background: var(--sheet); color: var(--ink); font-size: 13px; line-height: 1; padding: 0; }
.sort-dir:hover { border-color: var(--border-strong); }

/* ---------- list ---------- */
.list { overflow-y: auto; flex: 1; min-height: 0; -webkit-overflow-scrolling: touch; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; padding: 13px 18px; border-bottom: 1px solid var(--rule-2); cursor: pointer; position: relative; }
.row:hover { background: var(--sheet-2); }
.row[aria-current="true"] { background: var(--sheet-2); box-shadow: inset 3px 0 0 var(--ink); }
.row:focus-visible { outline-offset: -3px; }
.row .nm { font-weight: 600; letter-spacing: -.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { grid-column: 1; font-size: 13px; color: var(--slate); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .fig { text-align: right; font-size: 14px; font-weight: 500; }
.row .delta { text-align: right; font-size: 12px; }
.row .flags { grid-column: 1 / -1; display: flex; gap: 6px 10px; flex-wrap: wrap; margin-top: 4px; align-items: center; }
.row .cmp { margin-left: auto; }
.flag { font-size: 12px; color: var(--slate); }
.flag.good { color: var(--lamp-on); font-weight: 600; }
.flag.bad { color: var(--lamp-red); font-weight: 600; }
.flag.info { color: var(--ink); }
.flag.site { color: var(--slate); }
.flag.cov { display: inline-flex; }
.flag.warnflag { color: var(--lamp-amber); font-weight: 600; }
.up { color: var(--lamp-on); } .down { color: var(--lamp-red); } .flat { color: var(--mute); }
.cmp-box { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--mute); cursor: pointer; }
.cmp-box input { margin: 0; accent-color: var(--ink); }
.empty-list { padding: 28px 18px; color: var(--mute); text-align: center; }

/* ---------- the register sheet ---------- */
.dossier { max-width: 1060px; margin: 24px auto 120px; padding: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; display: block; }
.dossier > * { margin: 0; }
.back { display: none; background: none; border: 0; color: var(--stamp); padding: 18px 28px 0; font-weight: 600; }
.head { display: grid; grid-template-columns: 1fr auto; gap: 18px 24px; align-items: start; padding: 30px 32px 24px; border-bottom: 1px solid var(--rule); }
.head h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
.idline { color: var(--slate); margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 14px; }
.idline .num { color: var(--ink); font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { color: var(--lamp-on); }
.pill.bad { color: var(--lamp-red); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--rule); background: var(--sheet); border-radius: 9px; padding: 7px 13px; font-size: 14px; color: var(--ink); text-decoration: none; font-weight: 500; }
.btn:hover { border-color: var(--border-strong); background: var(--sheet-2); }
.btn.on { border-color: var(--ink); background: var(--ink); color: var(--sheet); }
a.btn { color: var(--ink); }

/* five areas, the sheet's signal post */
.coverage { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; margin: 20px 0 0; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.cv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; padding: 11px 14px; border-left: 1px solid var(--rule); font-size: 13px; background: var(--sheet); }
.cv:first-child { border-left: 0; }
.cv::before { content: ""; grid-row: 1 / span 2; width: 12px; height: 12px; border-radius: 50%; background: var(--lamp-off); }
.cv b { font-weight: 600; color: var(--ink); line-height: 1.25; }
.cv span { color: var(--mute); grid-column: 2; line-height: 1.25; }
.cv.available::before { background: var(--lamp-on); box-shadow: 0 0 0 3px var(--lamp-on-soft); }
.cv.available span { color: var(--lamp-on); }
.cv.ambiguous::before { background: var(--lamp-amber); box-shadow: 0 0 0 3px var(--lamp-amber-soft); }
.cv.ambiguous span { color: var(--lamp-amber); }
.cv.blocked::before, .cv.failed::before { background: var(--lamp-red); box-shadow: 0 0 0 3px var(--lamp-red-soft); }
.cv.blocked span, .cv.failed span { color: var(--lamp-red); }
.cov-why { grid-column: 1 / -1; margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13px; color: var(--slate); max-width: 78ch; }
.cov-why strong { color: var(--ink); font-weight: 600; }

.alert { margin: 0 32px; margin-top: 20px; background: var(--lamp-red-soft); color: var(--lamp-red); border-radius: 10px; padding: 12px 16px; font-weight: 600; }

/* sections are ruled parts of one sheet, not separate cards */
.card { background: none; border: 0; border-top: 1px solid var(--rule); border-radius: 0; padding: 24px 32px; min-width: 0; }
.head + .card, .alert + .card, .head + .tiles { border-top: 0; }
.card h2 { font-size: 18px; font-weight: 650; letter-spacing: -.01em; color: var(--ink); margin: 0 0 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.card h2 .src { font-weight: 400; font-size: 13px; letter-spacing: 0; }
.src { font-size: 13px; color: var(--mute); white-space: nowrap; }
.src a { color: var(--stamp); }

.brief p { margin: 0; font-size: 16.5px; line-height: 1.6; max-width: 72ch; }
.brief .points { margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; font-size: 16px; line-height: 1.55; max-width: 76ch; }
.brief .points li { padding-left: 20px; position: relative; }
.brief .points li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 8px; height: 1.5px; background: var(--mute); }
.brief .points li:first-child { font-size: 17.5px; font-weight: 500; color: var(--ink); }
.brief .cite { font-size: 11px; vertical-align: super; margin-left: 1px; color: var(--stamp); }
.watch { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule-2); display: grid; gap: 4px; }
.watch div { color: var(--lamp-amber); font-size: 14px; }

/* key figures: one ruled strip */
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--rule); }
.tile { background: none; border: 0; border-left: 1px solid var(--rule); border-radius: 0; padding: 20px 22px; min-width: 0; }
.tile:first-child { border-left: 0; padding-left: 32px; }
.tile .lbl { font-size: 13px; color: var(--slate); }
.tile .val { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .hint { font-size: 13px; color: var(--mute); margin-top: 4px; line-height: 1.5; }
.tile .na { color: var(--mute); font-weight: 400; font-size: 15px; letter-spacing: 0; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--rule); }
.grid2 > .card { border-top: 0; }
.grid2 > .card + .card { border-left: 1px solid var(--rule); }

.people { display: grid; gap: 0; }
.person { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule-2); align-items: baseline; }
.person:last-child { border-bottom: 0; }
.person .who { font-weight: 600; }
.person .role { color: var(--slate); font-size: 14px; text-align: right; }
.more-roles { margin-top: 10px; }
details > summary { cursor: pointer; color: var(--stamp); font-size: 14px; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+ "; font-weight: 600; }
details[open] > summary::before { content: "− "; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 9px 18px; margin: 0; }
.kv dt { color: var(--slate); font-size: 14px; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* activity: a dated line */
.tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.tab { border: 0; border-bottom: 2px solid transparent; background: none; border-radius: 0; padding: 7px 12px 9px; margin-bottom: -1px; font-size: 14px; color: var(--slate); }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.timeline { display: grid; margin-top: 6px; }
.ev { display: grid; grid-template-columns: 104px 18px 1fr; gap: 0 10px; padding: 0; }
.ev .when { font-size: 13px; color: var(--slate); padding: 12px 0; text-align: right; }
.ev::before { content: ""; grid-column: 2; grid-row: 1; justify-self: center; width: 1px; background: var(--rule); }
.ev .what { grid-column: 3; grid-row: 1; min-width: 0; padding: 11px 0 12px; position: relative; }
.ev .what::before { content: ""; position: absolute; left: -24px; top: 18px; width: 9px; height: 9px; border-radius: 50%; background: var(--sheet); border: 2px solid var(--mute); }
.ev:has(.kind.job) .what::before { border-color: var(--lamp-on); background: var(--lamp-on); }
.ev:has(.kind.news) .what::before { border-color: var(--ink); background: var(--ink); }
.ev:has(.kind.warn) .what::before { border-color: var(--lamp-red); background: var(--lamp-red); }
.ev .ttl { font-weight: 500; overflow-wrap: anywhere; }
.ev .ttl a { color: var(--ink); text-decoration-color: var(--rule); }
.ev .ttl a:hover { text-decoration-color: currentColor; }
.ev .meta { font-size: 13px; color: var(--mute); display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: center; margin-top: 2px; }
.kind { font-size: 12px; font-weight: 600; }
.kind.job { color: var(--lamp-on); }
.kind.news { color: var(--ink); }
.kind.notice { color: var(--slate); }
.kind.warn { color: var(--lamp-red); }
.timeline-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: var(--mute); gap: 8px; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; color: var(--stamp); padding: 0; font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
td.num { font-variant-numeric: tabular-nums; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--rule-2); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
thead th { font-size: 13px; color: var(--slate); font-weight: 600; border-bottom: 1px solid var(--rule); }
tbody th { font-weight: 400; color: var(--slate); font-size: 14px; }
tbody tr:hover td, tbody tr:hover th { background: var(--sheet-2); }
td.na { color: var(--mute); }

.missing { display: grid; gap: 5px; margin: 0; padding: 0; list-style: none; }
.missing li { color: var(--slate); font-size: 14px; padding-left: 20px; position: relative; }
.missing li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 8px; height: 8px; border-radius: 50%; background: var(--lamp-off); }

/* proof: everything in stamp blue */
.vbtn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid color-mix(in srgb, var(--stamp) 35%, transparent); background: none; color: var(--stamp); border-radius: 6px; font-size: 12px; font-weight: 600; padding: 1px 7px 1px 5px; margin-left: 8px; vertical-align: 1px; white-space: nowrap; min-height: 22px; line-height: 1.4; }
.vbtn::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid currentColor; box-shadow: inset 0 0 0 1.5px var(--sheet), inset 0 0 0 9px currentColor; flex: none; }
.vbtn:hover { background: var(--stamp); color: var(--stamp-ink); border-color: var(--stamp); }
.vbtn:hover::before { box-shadow: inset 0 0 0 1.5px var(--stamp), inset 0 0 0 9px var(--stamp-ink); }

.facts details { border-top: 1px solid var(--rule-2); padding: 11px 0; }
.facts details:first-of-type { border-top: 0; }
.facts summary { font-weight: 600; color: var(--ink); font-size: 15px; }
.facts summary::before { color: var(--mute); }
.fact { display: grid; grid-template-columns: minmax(140px, 230px) 1fr auto; gap: 4px 16px; padding: 8px 0; border-bottom: 1px solid var(--rule-2); align-items: baseline; }
.fact:last-child { border-bottom: 0; }
.fact .fl { color: var(--slate); font-size: 14px; }
.fact .fv { overflow-wrap: anywhere; font-size: 14px; }

#sources summary { font-weight: 600; color: var(--ink); font-size: 15px; }
.sources { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 14px; }
.source { border: 1px solid var(--rule); border-left: 3px solid var(--stamp); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; font-size: 14px; background: var(--sheet); min-width: 0; }
.source .s-top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.source .s-url { overflow-wrap: anywhere; font-size: 13px; }
.source .s-meta { color: var(--mute); font-size: 13px; }
.source code { font-size: 11px; color: var(--mute); overflow-wrap: anywhere; }
.copy { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; font-size: 12px; padding: 1px 7px; margin-left: 6px; color: var(--ink); }
.st { font-size: 12px; font-weight: 600; }
.st.available { color: var(--lamp-on); } .st.not_found, .st.not_available, .st.not_run { color: var(--mute); }
.st.blocked, .st.failed { color: var(--lamp-red); } .st.ambiguous { color: var(--lamp-amber); }

.welcome { padding: 80px 32px; text-align: center; color: var(--slate); }
.welcome h2 { color: var(--ink); font-size: 22px; letter-spacing: -.01em; }

/* ---------- compare tray and dialogs ---------- */
.tray { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--sheet); border-radius: 12px; padding: 8px 8px 8px 18px; display: flex; gap: 12px; align-items: center; box-shadow: var(--lift); max-width: calc(100vw - 32px); }
.tray[hidden] { display: none; }
.tray .names { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tray button { border-radius: 8px; padding: 7px 14px; border: 0; white-space: nowrap; }
.tray .go { background: var(--sheet); color: var(--ink); font-weight: 600; }
.tray .clr { background: transparent; color: inherit; opacity: .8; }
.modal { position: fixed; inset: 0; z-index: 40; background: var(--overlay); display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px; overflow-y: auto; }
.modal[hidden] { display: none; }
.sheet { background: var(--sheet); border-radius: 14px; width: 100%; max-width: 1100px; box-shadow: var(--lift); border: 1px solid var(--rule); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--rule); }
.sheet-head h2 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
.cmp-table th, .cmp-table td { white-space: normal; text-align: left; vertical-align: top; min-width: 170px; padding: 10px 14px; }
.cmp-table th:first-child { padding-left: 22px; }
.cmp-table tbody th { min-width: 150px; position: sticky; left: 0; background: var(--sheet); }
.cmp-table thead th { font-size: 15px; color: var(--ink); }
.cmp-table .best { color: var(--lamp-on); font-weight: 650; }
.toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 8px 16px; border-radius: 9px; font-size: 14px; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

/* the evidence slip */
.vsheet { max-width: 720px; }
.vsheet .sheet-head { border-bottom: 0; padding-bottom: 6px; }
.vsheet .sheet-head h2::before { content: ""; display: inline-block; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--stamp); box-shadow: inset 0 0 0 2px var(--sheet), inset 0 0 0 9px var(--stamp); margin-right: 10px; vertical-align: -1px; }
.vbody { padding: 6px 22px 22px; display: grid; gap: 14px; }
.vval { font-size: 19px; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; padding: 0 0 14px; border-bottom: 1px solid var(--rule); }
.vmeta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--slate); }
.vmeta strong { color: var(--lamp-on); }
.vev { border: 1px solid var(--rule); border-left: 3px solid var(--stamp); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; background: var(--sheet); }
.vev > div:first-child strong { font-size: 15px; }
.vev .vurl { overflow-wrap: anywhere; font-size: 14px; }
.vev dl { margin: 0; display: grid; grid-template-columns: 130px 1fr; gap: 5px 12px; font-size: 13px; }
.vev dt { color: var(--mute); }
.vev dd { margin: 0; overflow-wrap: anywhere; }
.vev dd code { font-size: 12px; color: var(--ink); }
.vev blockquote { margin: 2px 0; padding: 10px 14px; border-radius: 8px; background: var(--stamp-soft); color: var(--ink); font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
.vev .vact { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.vev .vact a.btn:first-child { background: var(--stamp); border-color: var(--stamp); color: var(--stamp-ink); }
.vnote { font-size: 13px; color: var(--mute); margin: 0; max-width: 70ch; }

/* ---------- motion: the lamps light once when a company opens ---------- */
html { scroll-behavior: smooth; }
.row, .btn, .tab, .chip-toggle, .top-btn, .sort-dir, .vbtn, .tray button { transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
.coverage .cv::before { animation: lamp .5s ease both; }
.coverage .cv:nth-child(2)::before { animation-delay: .08s; } .coverage .cv:nth-child(3)::before { animation-delay: .16s; }
.coverage .cv:nth-child(4)::before { animation-delay: .24s; } .coverage .cv:nth-child(5)::before { animation-delay: .32s; }
@keyframes lamp { from { opacity: .15; transform: scale(.6); } to { opacity: 1; transform: none; } }
.tray:not([hidden]) { animation: trayin .2s ease both; }
@keyframes trayin { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ---------- responsive ---------- */

  .coverage { grid-template-columns: 1fr; border-radius: 10px; }

  .coverage .cv:first-child { border-top: 0; }
  .cv span { grid-column: 3; grid-row: 1; text-align: right; }

  .card { padding: 20px 16px; }
  .alert { margin: 16px 16px 0; }
  .grid2 { grid-template-columns: 1fr; }

  .person { flex-wrap: wrap; }

  .covbar { grid-template-columns: 108px 1fr 64px; }
  .modal { padding: 0; }
  .sheet { border-radius: 0; min-height: 100%; border: 0; }
  .row { padding: 13px 16px; min-height: 66px; }
  .filters, .runbar { padding-left: 16px; padding-right: 16px; }
  .cmp-box { padding: 8px 0 8px 12px; font-size: 13px; }
  .cmp-box input { width: 20px; height: 20px; }
  .chip-toggle { padding: 8px 12px; font-size: 14px; }
  .filters select, .sort-ctl select { min-height: 42px; font-size: 15px; }
  .sort-dir { width: 42px; height: 42px; }
  .btn { padding: 10px 12px; }
  .tab { padding: 9px 12px 11px; }
  .vbtn { min-height: 28px; padding: 3px 9px 3px 7px; }
  .tray { left: 12px; right: 12px; transform: none; max-width: none; bottom: calc(12px + env(safe-area-inset-bottom)); }

  @keyframes trayin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
}
@media (max-width: 380px) { .tiles { grid-template-columns: 1fr; } .tile { border-left: 0 !important; } .tile:nth-child(2) { border-top: 1px solid var(--rule); } }

<script>
  // Sentence split for summary bullets that never breaks inside a quoted title ("… vareflyten? Vi har …").
  function splitSentences(text) {
    const out = []; let buf = ""; let quoted = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i]; buf += ch;
      if (ch === '"' || ch === '“' || ch === '”') quoted = ch === '“' ? true : ch === '”' ? false : !quoted;
      const initial = ch === "." && /(^|[\s(])[A-ZÆØÅ]$/.test(buf.slice(0, -1));  // "Ole K. Hansen"
      if (!quoted && !initial && /[.!?]/.test(ch) && /\s/.test(text[i + 1] || "") && /[A-ZÆØÅ"“(]/.test(text.slice(i + 1).trimStart()[0] || "")) {
        out.push(buf.trim()); buf = "";
      }
    }
    if (buf.trim()) out.push(buf.trim());
    return out.filter(Boolean);
  }

const RAW = /*__SIGNALPOST_DATA__*/[];

const norm = v => String(v ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
};
const safeUrl = u => { try { const p = new URL(u); return /^https?:$/.test(p.protocol) ? p.href : null; } catch (_) { return null; } };
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (_) { return u || ''; } };
const nf = new Intl.NumberFormat('nb-NO', { maximumFractionDigits: 0 });
const full = v => v == null ? null : 'NOK ' + nf.format(v);
function short(v) {
  if (v == null) return null;
  const a = Math.abs(v), s = v < 0 ? '−' : '';
  if (a >= 1e9) return `NOK ${s}${(a / 1e9).toFixed(a >= 1e10 ? 0 : 1)} bn`;
  if (a >= 1e6) return `NOK ${s}${(a / 1e6).toFixed(a >= 1e8 ? 0 : 1)} M`;

const fmtDate = d => {
  if (!d) return '';

  if (!m) return String(d);

/* ---------- derive ---------- */
function prep(x) {
  const recs = [...(x.financial?.records || [])].sort((a, b) => String(b.period?.tilDato || '').localeCompare(String(a.period?.tilDato || '')));
  const L = recs[0] || null, P = recs[1] || null;
  const yr = r => String(r?.period?.tilDato || '').slice(0, 4);
  const rev = L?.revenue ?? null, prevRev = P?.revenue ?? null;
  const growth = rev != null && prevRev ? (rev - prevRev) / Math.abs(prevRev) * 100 : null;
  const margin = rev > 0 && L?.operating_result != null ? L.operating_result / rev * 100 : null;
  const eqRatio = L?.assets > 0 && L?.equity != null ? L.equity / L.assets * 100 : null;

  const wv = x.web?.value || {};
  const verifiedWeb = x.web?.status === 'available' && !!wv.identity_assessment?.publishable;
  const webUrl = verifiedWeb ? safeUrl(wv.final_url || wv.requested_url || (x.website && !/^https?:/.test(x.website) ? 'https://' + x.website : x.website)) : null;
  const assessed = new Map((wv.social_link_assessments || []).map(a => [a.url, a]));
  const socials = verifiedWeb ? (wv.social_links || []).filter(s => safeUrl(s.url) && (!assessed.size || assessed.get(s.url)?.publishable)) : [];
  for (const h of x.external?.handles || []) if (safeUrl(h.url) && !socials.some(s => s.url === h.url)) socials.push(h);
  const contacts = verifiedWeb ? { emails: wv.contacts?.emails || wv.emails || [], phones: wv.contacts?.phones || wv.phones || [] } : { emails: [], phones: [] };

  const roles = (x.roles?.items || []).filter(r => !r.inactive)
    .sort((a, b) => roleRank(a.role_code) - roleRank(b.role_code));
  const ceo = roles.find(r => r.role_code === 'DAGL');
  const chair = roles.find(r => r.role_code === 'LEDE');

  const jobs = (x.jobs?.items || []).filter(j => j.title);
  const news = [...(x.siteNews || []), ...(x.news?.items || [])].filter(n => n.title);
  const notices = (x.announcements?.events || []).filter(e => e.title || e.date);
  const events = [
    ...jobs.map(j => ({ kind: 'job', date: j.published, title: j.title, url: j.url, meta: [j.location, j.extent, j.expires ? 'apply by ' + fmtDate(j.expires) : null].filter(Boolean), ai: j.ai })),
    ...news.map(n => ({ kind: 'news', date: n.date, title: n.title, url: n.url, meta: [n.source].filter(Boolean), ai: n.ai })),
    ...notices.map(e => ({ kind: WARNING.test(e.title || '') || e.category === 'insolvency' ? 'warn' : 'notice', routine: ROUTINE.test(e.title || ''), date: e.date, title: NOTICE_EN[e.title] || e.title, original: NOTICE_EN[e.title] ? e.title : null, url: e.url, meta: ['Brønnøysund public notice'] })),
  ].sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
  const twoYearsAgo = new Date(Date.now() - 730 * 864e5).toISOString().slice(0, 10);
  const recentChange = notices.some(e => CHANGE.test(e.title || '') && String(e.date || '') >= twoYearsAgo);
  const lastActivity = events.find(e => !e.routine && e.date)?.date || null;
  const sector = sectorOf(x.industryCode);
  if (NO_INDUSTRY.test(String(x.industry || '').trim())) x.industry = '';
  const search = norm([x.name, x.org, x.municipality, x.industry, x.industryCode, sector, verifiedWeb ? host(webUrl) : '', ...roles.map(r => r.name)].join(' '));
  // How much a reader can learn here: verified web presence, hiring, news, filed accounts, leadership.
  const cov = Array.isArray(x.cov) ? x.cov.map(([key, st, reason]) => ({ key, st, reason, label: AREA_LABEL[key] || key })) : null;
  const covN = cov ? cov.filter(a => a.st === 'available').length : null;
  const cantTell = !!cov && cov.some(a => a.st === 'ambiguous');
  const info = (verifiedWeb ? 4 : 0) + Math.min(jobs.length, 3) * 2 + Math.min(news.length, 3) + (L ? 2 : 0) + (rev > 0 ? 1 : 0) + (ceo ? 1 : 0) + Math.min(socials.length, 2) * 0.5;
  return { ...x, _: { recs, L, P, year: yr(L), prevYear: yr(P), rev, growth, margin, eqRatio, verifiedWeb, webUrl, socials, contacts, roles, ceo, chair, jobs, news, notices, events, recentChange, lastActivity, sector, search, info, cov, covN, cantTell } };
}
const DATA = RAW.map(prep);

fillSelect('#f-sector', DATA.map(x => x._.sector || 'No industry code'));

/* sort: one key per field; every field has a natural first direction */
const SORT_KEYS = {
  info: x => x._.info, name: x => x.name, revenue: x => x._.rev, growth: x => x._.growth, margin: x => x._.margin,
  equity: x => x._.eqRatio, employees: x => x.employees, activity: x => x._.lastActivity,

function filtered() {
  const q = norm(state.q).trim();
  const terms = q ? q.split(/\s+/) : [];
  const rows = DATA.filter(x => {
    const d = x._;
    if (terms.length && !terms.every(t => d.search.includes(t))) return false;
    if (state.sector && (d.sector || 'No industry code') !== state.sector) return false;
    if (state.form && formLabel(x.form) !== state.form) return false;
    if (state.muni && (x.municipality ? x.municipality.charAt(0) + x.municipality.slice(1).toLowerCase() : 'Not reported') !== state.muni) return false;
    const L = d.L;
    switch (state.fin) {
      case 'profitable': if (!(L?.operating_result > 0)) return false; break;
      case 'loss': if (!(L?.operating_result < 0)) return false; break;
      case 'growing': if (!(d.growth > 0)) return false; break;
      case 'declining': if (!(d.growth < 0)) return false; break;
      case 'rev10': if (!(d.rev >= 1e7)) return false; break;
      case 'solid': if (!(d.eqRatio >= 40)) return false; break;
      case 'negeq': if (!(L?.equity < 0)) return false; break;
    }
    if (state.sig.has('web') && !d.verifiedWeb) return false;
    if (state.sig.has('hiring') && !d.jobs.length) return false;
    if (state.sig.has('news') && !d.news.length) return false;
    if (state.sig.has('changes') && !d.recentChange) return false;
    if (state.sig.has('adverse') && !x.adverse) return false;
    if (state.sig.has('all5') && d.covN !== 5) return false;
    if (state.sig.has('canttell') && !d.cantTell) return false;
    return true;
  });

  const missing = v => v == null || v === '' || (typeof v === 'number' && !isFinite(v));

}

    const findable = String(span || '').replace(/^\d{4}-\d{2}-\d{2}:\s*/, '');  // "2026-04-09: Title" -> the title as the page shows it

        <a class="btn" href="${esc(brreg)}" target="_blank" rel="noreferrer">Brønnøysund ↗</a>
      </div>
        ${d.cov ? `<div class="coverage" aria-label="What was found">${d.cov.map(a => `<span class="cv ${esc(a.st)}" title="${esc(a.reason || 'Found and published with its source')}"><b>${esc(a.label)}</b><span>${esc(STATE_WORD[a.st] || a.st)}</span></span>`).join('')}</div>
          ${d.cov.some(a => a.st !== 'available') ? `<ul class="cov-why">${d.cov.filter(a => a.st !== 'available').map(a => `<li><strong>${esc(a.label)}:</strong> ${esc(a.reason)}</li>`).join('')}</ul>` : ''}` : ''}
    </div>`;

  /* warnings */
  const warns = d.events.filter(e => e.kind === 'warn');
  const alert = warns.length ? `<div class="alert">⚠ ${warns.slice(0, 2).map(w => `${esc(w.title)} (${esc(fmtDate(w.date))})`).join(' · ')}</div>` : '';

  /* brief */
  const ai = x.ai || {};
  const cites = srcs => (srcs || []).map(c => { const u = safeUrl(c.url); return u ? `<a class="cite" href="${esc(u)}" target="_blank" rel="noreferrer" title="${esc(c.kind || 'source')}">[${esc(c.id)}]</a>` : `<span class="cite">[${esc(c.id)}]</span>`; }).join('');
  let briefText = '';
  if (ai.available && ai.sentences?.length) briefText = ai.sentences.map(s => `${esc(s.text)}${cites(s.sources)}`).join(' ');
  else if (x.synthesis?.summary) {
    const parts = splitSentences(String(x.synthesis.summary));
    briefText = parts.length > 1 ? `<ul class="points">${parts.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : esc(x.synthesis.summary);
  }
  const watch = ai.available && ai.watch?.length ? `<div class="watch">${ai.watch.map(w => `<div>⚑ ${esc(w.text)}${cites(w.sources)}</div>`).join('')}</div>` : '';
  const brief = briefText ? `<section class="card brief"><h2>Summary<span class="src">${ai.available ? `written by ${esc(ai.model || 'model')} from ${ai.factCount} checked facts` : 'each point names its official source'}${vbf(x, 'executive_summary')}</span></h2>${briefText.startsWith('<ul') ? briefText : `<p>${briefText}</p>`}${watch}</section>` : '';

  /* key numbers */
  const L = d.L;
  const g = d.growth;
  const growthHint = g == null ? (d.P ? 'no prior-year revenue to compare' : 'only one year filed') : `<span class="${g > 0 ? 'up' : g < 0 ? 'down' : 'flat'}">${esc(pct(g, true))}</span> vs ${esc(d.prevYear)}`;
  const tiles = L ? `<div class="tiles">
      ${tile(`Revenue ${yr}`, L.revenue != null ? esc(short(L.revenue)) : null, growthHint, finSrc, vbf(x, 'revenue'))}
      ${tile(`Operating result ${yr}`, L.operating_result != null ? `<span class="${L.operating_result < 0 ? 'down' : ''}">${esc(short(L.operating_result))}</span>` : null, d.margin != null ? `${esc(pct(d.margin))} margin` : 'no revenue to compare', finSrc, vbf(x, 'operating_result'))}
      ${tile(`Net result ${yr}`, L.annual_result != null ? `<span class="${L.annual_result < 0 ? 'down' : ''}">${esc(short(L.annual_result))}</span>` : null, 'annual accounts', finSrc, vbf(x, 'annual_result'))}
      ${tile('Equity ratio', d.eqRatio != null ? `<span class="${d.eqRatio < 0 ? 'down' : ''}">${esc(pct(d.eqRatio))}</span>` : null, L.equity != null ? `equity ${esc(short(L.equity))}` : '', finSrc, vbf(x, 'equity_ratio_pct') || vbf(x, 'equity'))}
      ${tile('Employees', x.employees != null ? esc(nf.format(x.employees)) : null, x.employees != null ? 'registered' : 'none registered', regSrc, vbf(x, 'employees'))}
    </div>` : `<section class="card"><h2>Key numbers</h2><p>No annual accounts were returned by Regnskapsregisteret for this company. ${srcLink(finSrc)}</p></section>`;

  /* activity */
  const counts = { notable: d.events.filter(e => !e.routine).length, job: d.jobs.length, news: d.news.length, notice: d.notices.length };
  const shown = d.events.filter(e => state.tl === 'notable' ? !e.routine : state.tl === 'notice' ? (e.kind === 'notice' || e.kind === 'warn') : e.kind === state.tl);
  const visible = state.tlAll ? shown : shown.slice(0, 8);
  const tab = (key, label) => `<button type="button" class="tab" role="tab" data-tl="${key}" aria-selected="${state.tl === key}">${label} (${counts[key]})</button>`;
  const activity = `<section class="card">
    <h2>Activity <span class="src">newest first</span></h2>
    <div class="tabs" role="tablist">${tab('notable', 'Notable')}${tab('job', 'Jobs')}${tab('news', 'News')}${tab('notice', 'All public notices')}</div>
    <div class="timeline">${visible.length ? visible.map(e => {
      const u = safeUrl(e.url);
      const kindLabel = { job: 'Job', news: 'News', notice: 'Notice', warn: 'Warning' }[e.kind];
      return `<div class="ev"><div class="when num">${esc(fmtDate(e.date) || 'Undated')}</div><div class="what">
        <div class="ttl">${u ? `<a href="${esc(u)}" target="_blank" rel="noreferrer">${esc(e.title)}</a>` : esc(e.title)}${vb(x, e.kind === 'news' ? claimByValue(x, /^news_\d+_title$/, e.title) : e.kind === 'job' ? claimByValue(x, /^job_posting(_\d+)?_title$/, e.title) : claimByValue(x, /^corporate_action_\d+_title$/, e.original || e.title))}</div>
        <div class="meta"><span class="kind ${e.kind}">${kindLabel}</span>${e.original ? `<span lang="no">${esc(e.original)}</span>` : ''}${e.meta.map(m => `<span>${esc(m)}</span>`).join('')}</div>
        ${e.ai?.one_line ? `<div class="meta">${esc(e.ai.one_line)}</div>` : ''}
      </div></div>`;
    }).join('') : `<p class="src" style="white-space:normal">${state.tl === 'job' ? 'No open job postings found on NAV arbeidsplassen or the company website.' : state.tl === 'news' ? 'No dated news found that names this exact company.' : 'Nothing beyond routine filings.'}</p>`}</div>
    <div class="timeline-foot">
      <span>${state.tl === 'notable' && d.events.length > counts.notable ? `${d.events.length - counts.notable} routine filings hidden (annual accounts approvals, articles dates)` : ''}</span>
      ${shown.length > 8 ? `<button type="button" class="linkbtn" id="tl-more">${state.tlAll ? 'Show fewer' : `Show all ${shown.length}`}</button>` : ''}
    </div>
  </section>`;

  /* leadership */
  const key = d.roles.filter(r => ['DAGL', 'LEDE', 'INNH', 'FFØR'].includes(r.role_code));
  const rest = d.roles.filter(r => !key.includes(r));
  const personRow = r => `<div class="person"><span class="who">${esc(r.name || 'Unnamed')}${r.role_code === 'DAGL' || r.role_code === 'LEDE' ? (c => c && norm(c[2]).includes(norm(r.name)) ? vb(x, c) : '')(claimOf(x, r.role_code === 'DAGL' ? 'ceo' : 'board_chair')) : ''}</span><span class="role">${esc(ROLE[r.role_code] || r.role || r.group || 'Role')}${r.last_changed ? ` · since ${esc(String(r.last_changed).slice(0, 4))}` : ''}</span></div>`;
  const leadership = `<section class="card"><h2>Leadership ${srcLink(x.roles?.source)}</h2>
    ${d.roles.length ? `<div class="people">${(key.length ? key : d.roles.slice(0, 3)).map(personRow).join('')}</div>
      ${(key.length ? rest : d.roles.slice(3)).length ? `<details class="more-roles"><summary>${(key.length ? rest : d.roles.slice(3)).length} more (board, auditor, accountant)</summary><div class="people" style="margin-top:8px">${(key.length ? rest : d.roles.slice(3)).map(personRow).join('')}</div></details>` : ''}`
      : '<p class="src" style="white-space:normal">No roles registered in Brønnøysund.</p>'}
  </section>`;

  /* company info */
  const locs = x.locations?.items || [];
  const addr = l => { const a = l.address || {}; return [...(a.adresse || []), [a.postnummer, a.poststed].filter(Boolean).join(' ')].filter(Boolean).join(', '); };
  const info = `<section class="card"><h2>Company ${srcLink(regSrc)}</h2>
    <dl class="kv">
      <dt>Industry</dt><dd>${esc(x.industry || 'Not registered')}${x.industryCode && !/^0+\.?0*$/.test(x.industryCode) ? ` <span class="src num">${esc(x.industryCode)}</span>` : ''}</dd>
      <dt>Website</dt><dd>${d.verifiedWeb ? `<a href="${esc(d.webUrl)}" target="_blank" rel="noreferrer">${esc(host(d.webUrl))}</a> <span class="src">identity confirmed</span>${vbf(x, 'official_website')}` : `<span class="src">${esc(d.cov ? (d.cov.find(a => a.key === 'website')?.reason || 'No verified website') : 'No verified website')}</span>`}</dd>
      ${d.verifiedWeb && x.web?.value?.description ? `<dt>Says about itself</dt><dd>${esc(x.web.value.description)}</dd>` : ''}
      ${d.contacts.emails.length ? `<dt>Email</dt><dd>${d.contacts.emails.slice(0, 3).map(m => `<a href="mailto:${esc(m)}">${esc(m)}</a>`).join(', ')}</dd>` : ''}
      ${d.contacts.phones.length ? `<dt>Phone</dt><dd class="num">${d.contacts.phones.slice(0, 3).map(esc).join(', ')}</dd>` : ''}
      ${d.socials.length ? `<dt>Social</dt><dd>${d.socials.map(s => `<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noreferrer">${esc(titleCase(s.platform))}</a>${vbf(x, 'social_' + s.platform)}`).join(' · ')}</dd>` : ''}
      ${x.registryFacts?.founded ? `<dt>Founded</dt><dd class="num">${esc(x.registryFacts.founded)}</dd>` : ''}
      ${x.registryFacts?.shareCapital != null ? `<dt>Share capital</dt><dd class="num">${esc(x.registryFacts.shareCapitalCurrency)} ${esc(nf.format(x.registryFacts.shareCapital))}</dd>` : ''}
      ${x.registryFacts?.vatRegistered != null ? `<dt>VAT registered</dt><dd>${x.registryFacts.vatRegistered ? 'Yes' : 'No'}${x.registryFacts.inGroup ? ' · part of a corporate group' : ''}</dd>` : ''}
      ${x.registryFacts?.formerNames?.length ? `<dt>Former names</dt><dd>${x.registryFacts.formerNames.map(n => `${esc(n.name)}${n.to ? ` <span class="src">until ${esc(n.to)}</span>` : ''}`).join('<br>')}</dd>` : ''}
      ${L && typeof L.not_audited === 'boolean' ? `<dt>Accounts</dt><dd>${L.not_audited ? 'Not audited' : 'Audited'}${L.audit_opted_out ? ' · audit opted out' : ''} ${srcLink(finSrc)}</dd>` : ''}
      <dt>Workplaces</dt><dd>${locs.length ? `${locs.length} registered${locs.length ? `<details style="margin-top:4px"><summary>Show</summary>${locs.map(l => `<div style="margin-top:4px"><strong>${esc(l.name)}</strong><br><span class="src" style="white-space:normal">${esc(addr(l) || 'address not reported')}${l.employees != null ? ` · ${esc(l.employees)} employees` : ''}</span></div>`).join('')}</details>` : ''} ${srcLink(x.locations?.source)}` : '<span class="src">No registered subunits</span>'}</dd>
    </dl>
  </section>`;

  /* accounts table */
  const lines = [['Revenue', 'revenue'], ['Operating result', 'operating_result'], ['Result before tax', 'profit_before_tax'], ['Net result', 'annual_result'], ['Wage costs', 'wage_costs'], ['Total assets', 'assets'], ['Cash and bank', 'cash_and_bank'], ['Equity', 'equity'], ['Debt', 'debt'], ['Short-term debt', 'short_term_debt'], ['Long-term debt', 'long_term_debt']];
  const cols = d.recs; // newest year first, so phones see it without scrolling
  const accounts = cols.length ? `<section class="card"><h2>Annual accounts ${srcLink(finSrc, 'Regnskapsregisteret')}</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>NOK</th>${cols.map(r => `<th class="num">${esc(String(r.period?.tilDato || '').slice(0, 4))}</th>`).join('')}</tr></thead>
      <tbody>${lines.filter(([, k]) => cols.some(r => r[k] != null)).map(([lbl, k]) => `<tr><th>${lbl}</th>${cols.map(r => r[k] == null ? '<td class="na" title="Not reported in the filing">—</td>' : `<td class="num${r[k] < 0 ? ' down' : ''}">${esc(nf.format(r[k]))}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    <p class="src" style="white-space:normal;margin:8px 0 0">— means the line was not reported in the filing; it is not zero.${cols.some(r => r.account_type === 'KONSERN') ? ' Includes group (konsern) accounts.' : ''}</p>
  </section>` : '';

  /* not found */
  const missing = [];
  if (!L) missing.push('Annual accounts');
  if (!d.verifiedWeb) missing.push('A company website we could confirm belongs to this company');
  if (!d.jobs.length) missing.push('Open job postings');
  if (!d.news.length) missing.push('Dated news naming this exact company');
  if (x.employees == null) missing.push('Registered employee count');
  if (!d.roles.length) missing.push('Registered roles');
  for (const u of x.synthesis?.unknowns || []) {
    const label = u.dimension || u.item;
    if (label && !/employee/i.test(label) && !missing.some(m => norm(m).includes(norm(label)))) missing.push(label + (u.reason ? ` (${u.reason})` : ''));
  }
  const notFound = missing.length ? `<section class="card"><h2>Not found in checked sources</h2><ul class="missing">${missing.map(m => `<li>${esc(m)}</li>`).join('')}</ul></section>` : '';

  /* sources */
  const srcDefs = [
    ['Company register (Enhetsregisteret)', x.registry], ['Annual accounts (Regnskapsregisteret)', x.financial], ['Roles', x.roles],
    ['Subunits', x.locations], ['Public notices (Kunngjøringer)', x.announcements], ['News', x.news], ['Job postings (NAV)', x.jobs],
    ...(d.verifiedWeb ? [['Company website', x.web]] : []), ['Accounting obligation', x.accounting],
  ].filter(([, m]) => m && (m.source || m.hash));
  const sources = `<section class="card" id="sources"><details ${window.matchMedia('(min-width: 861px)').matches ? 'open' : ''}><summary>Sources and evidence (${srcDefs.length}) — open any source to verify</summary>
    <div class="sources">${srcDefs.map(([lbl, m]) => {
      const u = safeUrl(m.source);
      return `<div class="source"><div class="s-top"><strong>${esc(lbl)}</strong><span class="st ${esc(m.status || '')}">${esc(String(m.status || '').replaceAll('_', ' '))}</span></div>
        ${u ? `<a class="s-url" href="${esc(u)}" target="_blank" rel="noreferrer">${esc(u)}</a>` : ''}
        <div class="s-meta">${m.retrievedAt ? `Retrieved ${esc(String(m.retrievedAt).replace('T', ' ').slice(0, 16))} UTC` : ''}${m.effectiveAt ? ` · effective ${esc(m.effectiveAt)}` : ''}</div>
        ${m.claimSpan ? `<div class="s-meta">“${esc(m.claimSpan)}”</div>` : ''}
        ${m.hash ? `<div><code>sha256 ${esc(m.hash)}</code><button type="button" class="copy" data-copy="${esc(m.hash)}">Copy</button></div>` : ''}
      </div>`;
    }).join('')}</div></details>
    <p class="src" style="white-space:normal;margin:8px 0 0">Profile built ${esc(BUILT)}.</p></section>`;

  /* every published fact, exactly as in the scored envelope */
  const vf = vfOf(x);
  let facts = '';
  if (vf) {
    const byGroup = new Map(Object.keys(GROUPS).map(k => [k, []]));
    for (const c of vf.claims) (byGroup.get(c[1]) || byGroup.set(c[1], []).get(c[1])).push(c);
    facts = `<section class="card facts" id="facts"><h2>Published facts (${vf.claims.length})<span class="src">each one opens its source, hash and quoted text</span></h2>
      ${[...byGroup].filter(([, cs]) => cs.length).map(([g, cs]) => `<details ${g === 'website' ? 'open' : ''}><summary>${esc(GROUPS[g] || g)} (${cs.length})</summary>
        ${cs.map(c => `<div class="fact"><span class="fl">${esc(fieldLabel(c[0]))}</span><span class="fv">${esc(String(c[2]).length > 180 ? String(c[2]).slice(0, 179) + '…' : c[2])}</span>${vb(x, c)}</div>`).join('')}
      </details>`).join('')}
    </section>`;
  } else if (x.vf === 1) {
    facts = `<section class="card facts" id="facts"><h2>Published facts</h2><p class="src">Loading evidence…</p></section>`;
  } else if (x.vf === 'missing') {
    facts = `<section class="card facts" id="facts"><h2>Published facts</h2><p class="src" style="white-space:normal">The evidence file for this company was not found. Keep the folder <code>${esc(SIDECAR || '')}</code> next to this page.</p></section>`;
  }

  $('#detail').innerHTML = `<div class="dossier">${head}${alert}${brief}${tiles}${activity}<div class="grid2">${leadership}${info}</div>${accounts}${notFound}${facts}${sources}</div>`;
  if (x.vf === 1) ensureVf(x).then(() => { if (state.selected === x.org) renderDetail(); });

  $('#back').onclick = () => { document.body.dataset.view = 'list'; const r = $(`#list .row[data-org="${x.org}"]`); r?.scrollIntoView({ block: 'center' }); r?.focus(); };
  $('#d-cmp').onclick = () => toggleCompare(x.org, !state.compare.includes(x.org));
  $('#d-link').onclick = () => copy(location.href.split('#')[0] + '#org=' + x.org, 'Link copied');
  $('#d-json').onclick = () => { const { _, ...raw } = x; download(`${x.org}-${norm(x.name).replace(/[^a-z0-9]+/g, '-')}.json`, JSON.stringify(raw, null, 2), 'application/json'); };
  $$('[data-tl]').forEach(b => b.onclick = () => { state.tl = b.dataset.tl; state.tlAll = false; renderDetail(); });
  $('#tl-more')?.addEventListener('click', () => { state.tlAll = !state.tlAll; renderDetail(); });
  $$('[data-copy]').forEach(b => b.onclick = () => copy(b.dataset.copy, 'Hash copied'));
}

/* ---------- compare ---------- */
function toggleCompare(org, on) {
  const set = state.compare.filter(o => o !== org);
  if (on) { if (set.length >= 4) { toast('Compare holds up to 4 companies'); renderList(); return; } set.push(org); }
  state.compare = set; store.set('sp.compare', set);
  renderTray(); renderList();
  if (state.selected) renderDetail();
}
function renderTray() {
  const items = state.compare.map(o => byOrg.get(o)).filter(Boolean);
  $('#tray').hidden = !items.length;
  $('#tray-names').textContent = items.length === 1 ? `${items[0].name} — pick at least one more` : items.map(x => x.name).join(' · ');
  $('#tray-go').disabled = items.length < 2;
  $('#tray-go').style.opacity = items.length < 2 ? .5 : 1;
}
function renderCompare() {
  const cs = state.compare.map(o => byOrg.get(o)).filter(Boolean);
  const best = (vals, hi = true) => { const n = vals.filter(v => v != null && isFinite(v)); if (n.length < 2) return null; return hi ? Math.max(...n) : Math.min(...n); };
  const rowNum = (label, get, fmt, hi = true) => { const vals = cs.map(get); const b = best(vals, hi); return `<tr><th>${label}</th>${vals.map(v => `<td class="num ${v != null && v === b ? 'best' : ''}">${v == null || !isFinite(v) ? '<span class="flat">—</span>' : esc(fmt(v))}</td>`).join('')}</tr>`; };
  const rowTxt = (label, get) => `<tr><th>${label}</th>${cs.map(x => `<td>${get(x) || '<span class="flat">—</span>'}</td>`).join('')}</tr>`;
  const latestOf = x => x._.events.find(e => !e.routine);
  $('#cmp-body').innerHTML = `<table class="cmp-table">
    <thead><tr><th></th>${cs.map(x => `<th><a href="#org=${x.org}" data-goto="${x.org}">${esc(x.name)}</a><div class="src num">${esc(x.org)}</div></th>`).join('')}</tr></thead>
    <tbody>
      ${rowTxt('Industry', x => esc(x._.sector || x.industry || ''))}
      ${rowTxt('Municipality', x => esc(titleCase(x.municipality)))}
      ${rowTxt('Status', x => x.registryFacts?.deletedOn ? `<span class="pill bad">Deleted ${esc(x.registryFacts.deletedOn)}</span>` : x.adverse ? '<span class="pill bad">Bankruptcy / liquidation</span>' : '<span class="pill good">Active</span>')}
      ${rowTxt('Accounts year', x => esc(x._.year))}
      ${rowNum('Revenue', x => x._.rev, short)}
      ${rowNum('Revenue growth', x => x._.growth, v => pct(v, true))}
      ${rowNum('Operating result', x => x._.L?.operating_result ?? null, short)}
      ${rowNum('Operating margin', x => x._.margin, v => pct(v))}
      ${rowNum('Net result', x => x._.L?.annual_result ?? null, short)}
      ${rowNum('Equity ratio', x => x._.eqRatio, v => pct(v))}
      ${rowNum('Debt', x => x._.L?.debt ?? null, short, false)}
      ${rowNum('Employees', x => x.employees, v => nf.format(v))}
      ${rowTxt('CEO', x => esc(x._.ceo?.name || ''))}
      ${rowTxt('Board chair', x => esc(x._.chair?.name || ''))}
      ${rowTxt('Website', x => x._.verifiedWeb ? `<a href="${esc(x._.webUrl)}" target="_blank" rel="noreferrer">${esc(host(x._.webUrl))}</a>` : '')}
      ${rowTxt('Data found', x => x._.cov ? `${lamps(x._.cov)} <span class="src" style="white-space:normal">${esc(x._.covN)} of 5${x._.covN < 5 ? `; missing ${esc(x._.cov.filter(a => a.st !== 'available').map(a => a.label.toLowerCase()).join(', '))}` : ''}</span>` : '')}
      ${rowTxt('Open jobs', x => x._.jobs.length ? esc(x._.jobs.length) : '')}
      ${rowTxt('News items', x => x._.news.length ? esc(x._.news.length) : '')}
      ${rowTxt('Latest notable event', x => { const e = latestOf(x); return e ? `${esc(e.title)}<div class="src">${esc(fmtDate(e.date))}</div>` : ''; })}
    </tbody></table>
    <p class="src" style="white-space:normal;padding:8px 18px 14px;margin:0">Green marks the strongest value in each row. — means not reported.</p>`;
  $$('[data-goto]').forEach(a => a.onclick = e => { e.preventDefault(); closeCompare(); select(a.dataset.goto, true); });
}
function openCompare() { renderCompare(); $('#modal').hidden = false; $('#modal-close').focus(); }
function closeCompare() { $('#modal').hidden = true; }
$('#tray-go').onclick = openCompare;
$('#detail').addEventListener('click', e => { const b = e.target.closest('[data-verify]'); if (b) { e.preventDefault(); openVerify(byOrg.get(state.selected), b.dataset.verify); } });
$('#verify-close').onclick = closeVerify;
$('#verify').addEventListener('click', e => { if (e.target.id === 'verify') closeVerify(); });
$('#tray-clear').onclick = () => { state.compare = []; store.set('sp.compare', []); renderTray(); renderList(); if (state.selected) renderDetail(); };
$('#modal-close').onclick = closeCompare;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeCompare(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#verify').hidden) { closeVerify(); return; } if (e.key === 'Escape' && !$('#modal').hidden) closeCompare(); if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); } });

/* ---------- export ---------- */
$('#export-csv').onclick = () => {
  const rows = filtered();
  const cols = ['organisation_number', 'name', 'legal_form', 'municipality', 'industry_code', 'industry', 'employees', 'accounts_year', 'revenue', 'revenue_growth_pct', 'operating_result', 'operating_margin_pct', 'net_result', 'equity', 'equity_ratio_pct', 'debt', 'ceo', 'board_chair', 'verified_website', 'open_jobs', 'news_items', 'latest_notable_event', 'latest_notable_event_date', 'bankruptcy_or_liquidation', 'accounts_source'];
  const q = v => { if (v == null) return ''; const s = String(v); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const r1 = v => v == null || !isFinite(v) ? null : Math.round(v * 10) / 10;
  const lines = rows.map(x => { const d = x._; const ev = d.events.find(e => !e.routine); return [
    x.org, x.name, x.form, x.municipality, x.industryCode, x.industry, x.employees, d.year, d.rev, r1(d.growth), d.L?.operating_result, r1(d.margin), d.L?.annual_result, d.L?.equity, r1(d.eqRatio), d.L?.debt,
    d.ceo?.name, d.chair?.name, d.verifiedWeb ? d.webUrl : null, d.jobs.length, d.news.length, ev?.title, ev?.date, x.adverse ? 'yes' : 'no', x.financial?.source,
  ].map(q).join(','); });
  download(`signalpost-companies-${new Date().toISOString().slice(0, 10)}.csv`, '﻿' + [cols.join(','), ...lines].join('\n'), 'text/csv;charset=utf-8');
  toast(`Exported ${rows.length} companies`);
};

/* ---------- wiring ---------- */
let qTimer;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; document.body.dataset.view = 'list'; renderList(); }, 80); });
$('#f-sector').onchange = e => { state.sector = e.target.value; renderList(); };
$('#f-muni').onchange = e => { state.muni = e.target.value; renderList(); };
$('#f-fin').onchange = e => { state.fin = e.target.value; renderList(); };
$('#sort').onchange = e => {
  state.sort = e.target.value; state.dir = SORT_DEFAULT_DIR[state.sort] || 'desc';
  store.set('sp.sort2', state.sort); store.set('sp.dir2', state.dir); renderSortControl(); renderList();
};
$('#sort-dir').onclick = () => {
  state.dir = state.dir === 'asc' ? 'desc' : 'asc'; store.set('sp.dir2', state.dir); renderSortControl(); renderList();
};
$('#f-form').onchange = e => { state.form = e.target.value; renderList(); };
$$('[data-sig]').forEach(b => b.onclick = () => { const k = b.dataset.sig; state.sig.has(k) ? state.sig.delete(k) : state.sig.add(k); b.setAttribute('aria-pressed', state.sig.has(k)); renderList(); });
$('#reset').onclick = () => {
  Object.assign(state, { q: '', sector: '', muni: '', fin: '', form: '' }); state.sig.clear();
  $('#q').value = ''; $('#f-sector').value = ''; $('#f-muni').value = ''; $('#f-fin').value = ''; $('#f-form').value = '';
  $$('[data-sig]').forEach(b => b.setAttribute('aria-pressed', 'false')); renderList();
};
window.addEventListener('hashchange', () => { const m = location.hash.match(/org=(\d{9})/); if (m && m[1] !== state.selected) select(m[1], true); });

/* ---------- run panel: what this run found and the checks it passed ---------- */
function renderRun() {
  if (!RUN) return;
  const allOk = RUN.checks.every(c => c.ok);
  const when = RUN.completed_at ? fmtDate(RUN.completed_at) : BUILT;
  const n = RUN.companies || 0;
  $('#runbar').innerHTML = `<summary><span class="${allOk ? 'ok' : 'notok'}">${allOk ? '✓ All run checks passed' : '✗ A run check failed'}</span><span>${esc(nf.format(n))} companies · ${esc(when)}</span></summary>
    <div class="run-body">
      <div><strong>Found per area</strong><ul style="margin-top:4px">${RUN.coverage.map(a => `<li class="covbar"><span>${esc(a.label)}</span><span class="bar"><i style="width:${n ? Math.round(a.companies / n * 100) : 0}%"></i></span><span class="num">${esc(nf.format(a.companies))}/${esc(nf.format(n))}</span></li>`).join('')}</ul></div>
      <div><strong>Checks, recomputed from the envelopes</strong><ul style="margin-top:4px">${RUN.checks.map(c => `<li class="${c.ok ? 'ok' : 'notok'}">${c.ok ? '✓' : '✗'} <span style="color:var(--text);font-weight:400">${esc(c.label)}</span></li>`).join('')}</ul></div>
      <div class="kvline">
        <span>${esc(nf.format(RUN.published_facts))} published facts, each with its source</span>
        ${RUN.cant_tell ? `<span>${esc(nf.format(RUN.cant_tell))} with a "can't tell" area</span>` : ''}
        ${RUN.requests != null ? `<span>${esc(nf.format(RUN.requests))} requests</span>` : ''}
        ${RUN.runtime_seconds != null ? `<span>${esc(Math.round(RUN.runtime_seconds / 60 * 10) / 10)} min</span>` : ''}
        ${RUN.cost_usd != null ? `<span>$${esc(Number(RUN.cost_usd).toFixed(2))} third-party cost</span>` : ''}
        ${RUN.commit ? `<span>commit <code>${esc(String(RUN.commit).slice(0, 7))}</code></span>` : ''}
        ${RUN.run_id ? `<span>run <code>${esc(RUN.run_id)}</code></span>` : ''}
        <span>page built ${esc(BUILT)}</span>
      </div>
    </div>`;
  $('#runbar').hidden = false;
}
if (DATA.some(x => x._.cov)) $$('[data-sig="all5"], [data-sig="canttell"]').forEach(b => b.hidden = false);
renderRun();

const initial = renderList();
const fromHash = location.hash.match(/org=(\d{9})/);
if (fromHash && byOrg.has(fromHash[1])) select(fromHash[1], true);
else if (initial.length && matchMedia('(min-width: 861px)').matches) select(initial[0].org, false);
else renderDetail();
renderTray();
</script>
</body>
</html>
